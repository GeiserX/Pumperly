site_name: Pumperly
site_url: https://geiserx.github.io/Pumperly
site_description: Open-source fuel and EV charging price map and route planner. Self-hosted, with official price data from dozens of countries.
repo_url: https://github.com/GeiserX/Pumperly
repo_name: GeiserX/Pumperly
edit_uri: edit/main/docs/

# A warning is a broken link, a missing page or a page nobody can reach. All of
# them fail the build, locally and in CI, so nobody has to remember --strict.
strict: true

theme:
  name: material
  language: en
  logo: images/logo.svg
  favicon: images/icon.svg
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github

# MkDocs reports most link problems as `info`, which --strict ignores. Every
# line here promotes one of them to a warning so the build fails on it:
#   nav.omitted_files   a Markdown file under docs/ that is in no nav entry and
#                       not in exclude_docs (a page nobody can reach, published
#                       at a public URL anyway);
#   nav.not_found       a nav entry whose file does not exist;
#   links.not_found     a relative link to a page or file that does not exist;
#   links.anchors       a link to a heading that does not exist;
#   links.absolute_links  a link written as /path/ (breaks under the /Pumperly/
#                       prefix of the site);
#   links.unrecognized_links  a relative link that leaves docs/ (../README.md).
#                       Repo files are linked by absolute GitHub URL instead.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

plugins:
  - search
  # Renamed pages keep their old URLs alive.
  - redirects:
      redirect_maps:
        contributing.md: development.md
        getting-started/development.md: development.md
        integrations.md: related.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # base_path includes the repository root, so a page can include a file that
  # ships, such as docker/docker-compose.yml or .env.example, word for word. A
  # copied example drifts from the real file; an included one cannot.
  #
  # check_paths makes a missing include fail the build. Without it the page
  # renders an empty block and nobody notices.
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  - pymdownx.mark
  - attr_list
  - md_in_html
  # Turns :material-xxx: shortcodes into icons. The grid cards on the home page
  # use them, and without this extension they print as literal text.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/solid/gas-pump
      link: https://pumperly.com
    - icon: fontawesome/brands/github
      link: https://github.com/GeiserX/Pumperly
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/drumsergio/pumperly

extra_css:
  - stylesheets/theme.css

# Files under docs/ that must not be published as pages. MkDocs builds every
# Markdown file in docs_dir, listed in nav or not; validation.nav.omitted_files
# above fails the build on a page left out of nav, and this list keeps the
# files that are not pages out of the site.
exclude_docs: |
  # The docs build dependencies. The workflow reads them from docs/; they are
  # not a page.
  requirements-docs.txt

nav:
  - Home: index.md
  - Features at a glance: features.md
  - Get started:
      - Run with Docker Compose: getting-started/docker-compose.md
      - What happens on first start: getting-started/first-start.md
      - Full stack with routing and geocoding: getting-started/full-stack.md
      - Run on Kubernetes with Helm: getting-started/kubernetes.md
  - Using Pumperly:
      - The map: using/map.md
      - Planning a route: using/routes.md
      - EV charging: using/ev-charging.md
      - Share links and deep links: using/links.md
  - Data sources:
      - Coverage and status: data/coverage.md
      - Sources at a glance: data/sources-at-a-glance.md
      - Fuel price sources: data/fuel-sources.md
      - EV charging sources: data/ev-sources.md
      - How scrapers work: data/how-scrapers-work.md
      - Adding a country: data/adding-a-country.md
  - Configuration:
      - Countries and scrape schedule: configuration/countries-and-schedule.md
      - Routing with Valhalla: configuration/routing-valhalla.md
      - Geocoding with Photon: configuration/geocoding-photon.md
      - API keys: configuration/api-keys.md
  - Operations:
      - Upgrading: operations/upgrading.md
      - Backing up the database: operations/backup-and-restore.md
      - Monitoring and troubleshooting: operations/troubleshooting.md
  - Reference:
      - Environment variables: reference/environment-variables.md
      - HTTP API: reference/api.md
      - Data model: reference/data-model.md
      - Fuel types: reference/fuel-types.md
      - Currencies and exchange rates: reference/currencies.md
      - Glossary: reference/glossary.md
  - Related projects: related.md
  - Roadmap: roadmap.md
  - Development: development.md
