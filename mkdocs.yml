site_name: Pumperly
site_url: https://geiserx.github.io/Pumperly
site_description: Open-source fuel and EV charging price map and route planner. Self-hosted, with official price data from dozens of countries.
repo_url: https://github.com/GeiserX/Pumperly
repo_name: GeiserX/Pumperly
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: logo.svg
  favicon: icon.svg
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github

# A cross-link to a heading that no longer exists is only an info line in
# MkDocs 1.6, even with --strict. Promoting it to a warning makes the strict
# build fail on it.
validation:
  anchors: warn
  links:
    absolute_links: warn

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # base_path includes the repository root, so a page can include a file that
  # ships, such as docker/docker-compose.yml or .env.example, word for word. A
  # copied example drifts from the real file; an included one cannot.
  #
  # check_paths makes a missing include fail the build. Without it the page
  # renders an empty block and nobody notices.
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  - pymdownx.mark
  - attr_list
  - md_in_html
  # Turns :material-xxx: shortcodes into icons. The grid cards on the home page
  # use them, and without this extension they print as literal text.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/solid/gas-pump
      link: https://pumperly.com
    - icon: fontawesome/brands/github
      link: https://github.com/GeiserX/Pumperly
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/drumsergio/pumperly

extra_css:
  - stylesheets/theme.css

# Files under docs/ that must not be published as pages.
#
# MkDocs builds every Markdown file in docs_dir, listed in nav or not. A file
# left out of nav still gets a public URL. `mkdocs build --strict` does not
# catch this: validation.nav.omitted_files defaults to `info`, and --strict
# only turns warnings into errors. The only reliable guard is this list.
exclude_docs: |
  # The docs build dependencies. The workflow reads them from docs/; they are
  # not a page.
  requirements-docs.txt

nav:
  - Home: index.md
  - Features at a glance: features.md
  - Get started:
      - Run with Docker Compose: getting-started/docker-compose.md
      - What happens on first start: getting-started/first-start.md
      - Full stack with routing and geocoding: getting-started/full-stack.md
      - Run on Kubernetes with Helm: getting-started/kubernetes.md
      - Local development: getting-started/development.md
  - Using Pumperly:
      - The map: using/map.md
      - Planning a route: using/routes.md
      - EV charging: using/ev-charging.md
      - Share links and deep links: using/links.md
  - Data sources:
      - Coverage and status: data/coverage.md
      - Sources at a glance: data/sources-at-a-glance.md
      - Fuel price sources: data/fuel-sources.md
      - EV charging sources: data/ev-sources.md
      - How scrapers work: data/how-scrapers-work.md
      - Adding a country: data/adding-a-country.md
  - Configuration:
      - Countries and scrape schedule: configuration/countries-and-schedule.md
      - Routing with Valhalla: configuration/routing-valhalla.md
      - Geocoding with Photon: configuration/geocoding-photon.md
      - API keys: configuration/api-keys.md
  - Operations:
      - Upgrading: operations/upgrading.md
      - Backing up the database: operations/backup-and-restore.md
      - Monitoring and troubleshooting: operations/troubleshooting.md
  - Reference:
      - Environment variables: reference/environment-variables.md
      - HTTP API: reference/api.md
      - Data model: reference/data-model.md
      - Fuel types: reference/fuel-types.md
      - Currencies and exchange rates: reference/currencies.md
      - Glossary: reference/glossary.md
  - Integrations: integrations.md
  - Roadmap: roadmap.md
  - Contributing: contributing.md
